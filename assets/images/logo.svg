<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Glowing background ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#glowGrad)" stroke-width="3" stroke-dasharray="8 6" />

  <!-- Water Droplet Body -->
  <path d="M 100,24 C 100,24 156,92 156,128 A 56,56 0 1,1 44,128 C 44,92 100,24 100,24 Z" 
        fill="url(#waterGrad)" filter="url(#shadow)" />

  <!-- Inner Water Wave / Pulse -->
  <path d="M 54,126 Q 77,112 100,126 T 146,126 A 46,46 0 0,1 54,126 Z" 
        fill="#ffffff" fill-opacity="0.22" />

  <!-- IoT Pulse Nodes -->
  <circle cx="100" cy="88" r="7" fill="#ffffff" />
  <circle cx="82" cy="130" r="5" fill="#38bdf8" />
  <circle cx="118" cy="130" r="5" fill="#38bdf8" />
  
  <!-- Circuit Connectors -->
  <path d="M 100,88 L 82,130 M 100,88 L 118,130 M 82,130 L 118,130" 
        stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.75" />
        
  <!-- Droplet Highlight -->
  <ellipse cx="80" cy="68" rx="8" ry="16" transform="rotate(-30 80 68)" fill="#ffffff" fill-opacity="0.35" />
</svg>
